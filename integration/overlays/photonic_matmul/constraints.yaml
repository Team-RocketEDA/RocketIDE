    comparison: "<="
    value: -15.0
    unit: dB
    required: true
  - id: identity.in2_out4
    title: Blocks in2 -> out4 at 1550 nm
    metric: T(in2->out4)@1550.0nm
    comparison: "<="
    value: -15.0
    unit: dB
    required: true
  - id: identity.in3_out1
    title: Blocks in3 -> out1 at 1550 nm
    metric: T(in3->out1)@1550.0nm
    comparison: "<="
    value: -15.0
    unit: dB
