schema: rocketeda/constraints/v0.1
title: Photonic matrix multiplier
description: Coherent MZI-mesh matrix multiplier on CORNERSTONE Si340, laid out with GDSFactory and checked with SAX.
pdk: cornerstone_si340
domains: [photonic]
agent:
  iteration_limit: 3
  mode: approval

# RocketIDE overlay: replaces the demo's checks so the Overview can show what Run checks measures.
# Run checks runs one spec, tests/tb_mesh4_identity.yml, through the engine's run_optical (SAX).
# The engine judges each target from that spec and names its measurement T(from->to)@<nm>nm; each
# check's metric is that name, and comparison/value repeat the spec bound so the table reads right.
# The demo's unit-cell, swap, Hadamard and DRC checks run from its own tests (pytest), not from here.
checks:
  - id: identity.in1_out1
    title: Routes in1 -> out1 at 1550 nm
    metric: T(in1->out1)@1550.0nm
    comparison: ">="
    value: -6.0
    unit: dB
    required: true
  - id: identity.in1_out2
    title: Blocks in1 -> out2 at 1550 nm
    metric: T(in1->out2)@1550.0nm
    comparison: "<="
    value: -15.0
    unit: dB
    required: true
  - id: identity.in1_out3
    title: Blocks in1 -> out3 at 1550 nm
    metric: T(in1->out3)@1550.0nm
    comparison: "<="
    value: -15.0
    unit: dB
    required: true
  - id: identity.in1_out4
    title: Blocks in1 -> out4 at 1550 nm
    metric: T(in1->out4)@1550.0nm
    comparison: "<="
    value: -15.0
    unit: dB
    required: true
  - id: identity.in2_out1
    title: Blocks in2 -> out1 at 1550 nm
