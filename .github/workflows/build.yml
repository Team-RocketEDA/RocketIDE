# Builds and tests the whole bundle on a clean machine. A v* tag also publishes a release.
#
# The submodules are public repos, which the default token can read. A SUBMODULES_TOKEN secret overrides it, for a
# fork whose submodules are private.
#
# The engine's installer registers a PDK and stops without one. CI uses a prebuilt sky130A from ciel-releases,
# only the parts the demos use (common, primitives, HD cells), and tells the engine its revision.
name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SKY130_REVISION: 792ef67037d74c8c51811eab3ce23cf793491296

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    # The image builds the engine's toolchain from source.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: sky130A (cached)
        id: pdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pdk
          key: sky130A-${{ env.SKY130_REVISION }}-pr-hd
      - name: Fetch sky130A
        if: steps.pdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pdk"
          base="https://github.com/fossi-foundation/ciel-releases/releases/download/sky130-$SKY130_REVISION"
          for part in common sky130_fd_pr sky130_fd_sc_hd; do
            curl -fsSL "$base/$part.tar.zst" | tar --zstd -x -C "$RUNNER_TEMP/pdk" --wildcards 'sky130A/*'
          done
          test -f "$RUNNER_TEMP/pdk/sky130A/.config/nodeinfo.json"
      - name: Build the image
        run: docker build -t rocketide .
      - name: End-to-end test inside the container
        run: |
          docker run --rm -e PDK_REVISION="$SKY130_REVISION" -v "$RUNNER_TEMP/pdk/sky130A:/pdk:ro" \
            rocketide python3 scripts/smoke.py --strict
      - name: Serve the app from the container
        run: |
          docker run -d --name rocketide -p 127.0.0.1:5173:5173 \
            -e PDK_REVISION="$SKY130_REVISION" -v "$RUNNER_TEMP/pdk/sky130A:/pdk:ro" rocketide
          for _ in $(seq 1 120); do
            curl -fsS http://localhost:5173/api/status && break
            sleep 2
          done
          curl -fsS http://localhost:5173/ | grep 'id="root"'
          curl -fsS http://localhost:5173/api/projects | grep albert-chip-demo
      - name: Container logs
        if: failure()
        run: docker logs rocketide || true

  desktop:
    name: Desktop app
    runs-on: ubuntu-24.04
    # install.sh provisions the engine's toolchain, building some of it from source.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: sky130A (cached)
        id: pdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pdk
          key: sky130A-${{ env.SKY130_REVISION }}-pr-hd
      - name: Fetch sky130A
        if: steps.pdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pdk"
          base="https://github.com/fossi-foundation/ciel-releases/releases/download/sky130-$SKY130_REVISION"
          for part in common sky130_fd_pr sky130_fd_sc_hd; do
            curl -fsSL "$base/$part.tar.zst" | tar --zstd -x -C "$RUNNER_TEMP/pdk" --wildcards 'sky130A/*'
          done
          test -f "$RUNNER_TEMP/pdk/sky130A/.config/nodeinfo.json"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - name: Install system packages
        # The window's libraries, and what the engine's provisioner builds its tools with (rocket-engine/Dockerfile).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb imagemagick ngspice \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libgtk-3-0t64 libgbm1 libasound2t64 \
            make cmake gcc g++ gfortran bison flex swig tcl tcl-dev tk tk-dev libx11-dev bzip2 xz-utils unzip
      - name: Install, the engine's way
        env:
          PDK_SOURCE: ${{ runner.temp }}/pdk/sky130A
          PDK_REVISION: ${{ env.SKY130_REVISION }}
        run: ./install.sh
      - name: Open the window and capture it
        env:
          DISPLAY: ":99"
          # Hosted runners restrict the unprivileged user namespaces Electron's sandbox needs.
          ELECTRON_DISABLE_SANDBOX: "1"
        run: |
          Xvfb :99 -screen 0 1500x920x24 &
          sleep 2
          ./run.sh desktop > desktop.log 2>&1 &
          sleep 30
          import -window root desktop.png
          pgrep -f 'electron' > /dev/null || { cat desktop.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-app
          path: |
            desktop.png
            desktop.log

  agent:
    name: Agent guardrails and UI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install the agent
        working-directory: rocket_fuel
        run: |
          npm ci --no-audit --no-fund
          (cd mcp-stub && uv sync --locked --no-dev)
      - name: Scripted scenarios, including what the tutor and reviewer can't do
        working-directory: rocket_fuel
        run: python3 -I evals/run_scenarios.py
      - name: Plugin and client tests
        working-directory: rocket_fuel
        run: |
          python3 -I scripts/meta_relay_test.py
          (cd plugin && bun install --frozen-lockfile && bun test)
          (cd client && bun install --frozen-lockfile && bun test)
      - name: UI tests and types
        working-directory: UIUX
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npx tsc -b --noEmit
          npm test

  demos:
    name: MobileLLM checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog
      # Not src/scripts/elab.sh: elaborating the whole chip at once outlasts this job's time limit. The Docker job
      # runs the mac_unit testbench through the engine.
      - name: MobileLLM contract tests
        working-directory: Demos/albert-chip-demo
        run: python3 -m unittest discover -s architecture/tests

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker, desktop, agent, demos]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          fetch-depth: 0
      - name: sky130A (cached)
        id: pdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pdk
          key: sky130A-${{ env.SKY130_REVISION }}-pr-hd
      - name: Fetch sky130A
        if: steps.pdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pdk"
          base="https://github.com/fossi-foundation/ciel-releases/releases/download/sky130-$SKY130_REVISION"
          for part in common sky130_fd_pr sky130_fd_sc_hd; do
            curl -fsSL "$base/$part.tar.zst" | tar --zstd -x -C "$RUNNER_TEMP/pdk" --wildcards 'sky130A/*'
          done
          test -f "$RUNNER_TEMP/pdk/sky130A/.config/nodeinfo.json"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - name: Build and upload the archive
        env:
          GH_TOKEN: ${{ github.token }}
          PDK_SOURCE: ${{ runner.temp }}/pdk/sky130A
          PDK_REVISION: ${{ env.SKY130_REVISION }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make cmake gcc g++ gfortran bison flex swig tcl tcl-dev tk tk-dev libx11-dev bzip2 xz-utils unzip
          ./install.sh --no-desktop --release "$GITHUB_REF_NAME"
