<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">RocketIDE</title>
  <desc id="desc">RocketIDE: design chips with an AI agent beside you. Every PASS comes from a real EDA tool.</desc>
  <style>
.tile{transform-box:fill-box;transform-origin:center;animation:tile-in .5s cubic-bezier(.2,.9,.3,1.25) both}
.rocket{animation:rise 1s .2s cubic-bezier(.2,.85,.25,1.15) both}
.flame{transform-box:fill-box;transform-origin:50% 0;animation:ignite .9s .2s ease-out both,flicker .16s 1.15s ease-in-out infinite alternate}
.window{transform-box:fill-box;transform-origin:center;animation:pop .35s 1.05s cubic-bezier(.3,1.6,.5,1) both}
.pin{stroke-dasharray:5;animation:trace .3s ease-out both}
.p1{animation-delay:1s}.p2{animation-delay:1.08s}.p3{animation-delay:1.16s}.p4{animation-delay:1.24s}
@keyframes tile-in{from{opacity:0;transform:scale(.55)}}
@keyframes rise{from{transform:translateY(30px)}}
@keyframes ignite{0%{transform:scaleY(0)}55%{transform:scaleY(1.6)}100%{transform:scaleY(1)}}
@keyframes flicker{from{transform:scaleY(1);opacity:1}to{transform:scaleY(.72);opacity:.8}}
@keyframes pop{from{transform:scale(0)}}
@keyframes trace{from{stroke-dashoffset:5}}


.word{animation:fade .7s .5s ease-out both}.line1{animation:fade .7s .8s ease-out both}.line2{animation:fade .7s 1s ease-out both}
.tools{animation:fade .7s 1.3s ease-out both}
.die{animation:fade .8s .3s ease-out both}
.sig{stroke-dasharray:6 130;animation:signal 2.8s linear infinite}
.s2{animation-delay:.7s}.s3{animation-delay:1.4s}.s4{animation-delay:2.1s}.s5{animation-delay:1.05s}.s6{animation-delay:1.75s}
.pad{animation:blink 2.8s ease-in-out infinite}.d2{animation-delay:.7s}.d3{animation-delay:1.4s}.d4{animation-delay:2.1s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
@keyframes signal{from{stroke-dashoffset:136}to{stroke-dashoffset:0}}
@keyframes blink{0%,70%,100%{opacity:1}80%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151414"/><stop offset="1" stop-color="#0f0e0e"/></linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55"><stop offset="0" stop-color="#ee6a4c" stop-opacity="0.22"/><stop offset="1" stop-color="#ee6a4c" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#262422" stroke-width="1"/></pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f0e0e"/><stop offset="0.45" stop-color="#0f0e0e" stop-opacity="0.85"/><stop offset="1" stop-color="#0f0e0e" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="18" fill="url(#fade)"/>
  <rect width="1280" height="320" rx="18" fill="url(#glow)"/>
  <g class="die" transform="translate(905 58)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="204" height="204" rx="14" fill="#1b1a19" stroke="#34312e" stroke-width="2"/>
    <rect x="52" y="52" width="100" height="100" rx="8" fill="#2c1a16" stroke="#ee6a4c" stroke-width="2"/>
    <g transform="translate(70 66) scale(1.0)"><path d="M32 8.5c6.4 5.2 9.2 12.6 9.2 21.6V46H22.8V30.1c0-9 2.8-16.4 9.2-21.6z" fill="#ee6a4c" opacity="0.9" transform="translate(0 2) scale(1)"/>
      <path d="M22.8 36.5 15.5 45v5.2l7.3-3.2zM41.2 36.5 48.5 45v5.2l-7.3-3.2z" fill="#ee6a4c" opacity="0.9"/><circle cx="32" cy="27" r="4.3" fill="#2c1a16"/></g>
    <g stroke="#84807a" stroke-width="2"><path d="M52 76H22V30"/><path d="M52 128H30v46"/><path d="M152 76h30V22"/><path d="M152 128h22v54"/><path d="M78 52V24h-26"/><path d="M126 152v28h28"/></g>
    <g stroke="#ee6a4c" stroke-width="2.4"><path class="sig s1" d="M52 76H22V30"/><path class="sig s2" d="M52 128H30v46"/><path class="sig s3" d="M152 76h30V22"/><path class="sig s4" d="M152 128h22v54"/><path class="sig s5" d="M78 52V24h-26"/><path class="sig s6" d="M126 152v28h28"/></g>
    <g stroke="none"><circle class="pad" cx="22" cy="30" r="5" fill="#6cc890"/><circle class="pad d2" cx="182" cy="22" r="5" fill="#6cc890"/>
      <circle class="pad d3" cx="154" cy="180" r="5" fill="#6cc890"/><circle class="pad d4" cx="30" cy="174" r="5" fill="#ee6a4c"/>
      <circle class="pad d2" cx="52" cy="24" r="5" fill="#ee6a4c"/><circle class="pad d3" cx="174" cy="182" r="5" fill="#ee6a4c"/></g>
    <g stroke="#34312e" stroke-width="6"><path d="M-14 40h10M-14 70h10M-14 100h10M-14 130h10M-14 160h10"/><path d="M208 40h10M208 70h10M208 100h10M208 130h10M208 160h10"/></g>
  </g>
  <svg x="72" y="88" width="72" height="72" viewBox="0 0 64 64"><g class="tile"><rect width="64" height="64" rx="15" fill="#ee6a4c"/></g>
<clipPath id="tileclip"><rect width="64" height="64" rx="15"/></clipPath>
<g clip-path="url(#tileclip)"><g class="rocket">
  <g class="flame"><path d="M27.6 49h8.8L32 57.5z" fill="#ffd3c6"/></g>
  <path d="M22.8 36.5 15.5 45v5.2l7.3-3.2zM41.2 36.5 48.5 45v5.2l-7.3-3.2z" fill="#ffffff"/>
  <path d="M32 8.5c6.4 5.2 9.2 12.6 9.2 21.6V46H22.8V30.1c0-9 2.8-16.4 9.2-21.6z" fill="#ffffff"/>
  <circle class="window" cx="32" cy="27" r="4.3" fill="#ee6a4c"/>
  <g stroke="#ffffff" stroke-width="2.6" stroke-linecap="round">
    <path class="pin p1" d="M17.8 23.5h5"/><path class="pin p2" d="M41.2 23.5h5"/>
    <path class="pin p3" d="M17.8 30h5"/><path class="pin p4" d="M41.2 30h5"/>
  </g>
</g></g></svg>
  <text class="word" x="164" y="141" font-family="Manrope, Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="54" font-weight="800" fill="#ecebe8" letter-spacing="-1.2">RocketIDE</text>
  <text class="line1" x="72" y="214" font-family="Manrope, Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" fill="#b8b4ae">Design chips with an AI agent beside you.</text>
  <text class="line2" x="72" y="248" font-family="Manrope, Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" fill="#b8b4ae">Every <tspan fill="#6cc890" font-weight="700">PASS</tspan> comes from a real EDA tool.</text>
  <text class="tools" x="72" y="288" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#84807a">analog · digital · photonic   —   ngspice · Icarus · SAX · Magic · KLayout · LibreLane</text>
</svg>
