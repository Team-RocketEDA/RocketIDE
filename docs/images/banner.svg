<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">RocketIDE</title>
  <desc id="desc">RocketIDE: design chips with an AI agent. Every verdict comes from real EDA tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151414"/>
      <stop offset="1" stop-color="#0f0e0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#ee6a4c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ee6a4c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#262422" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f0e0e" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#0f0e0e" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0f0e0e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="18" fill="url(#fade)"/>
  <rect width="1280" height="320" rx="18" fill="url(#glow)"/>

  <!-- Die with routed traces and pads, on the right -->
  <g transform="translate(905 58)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="204" height="204" rx="14" fill="#1b1a19" stroke="#34312e" stroke-width="2"/>
    <rect x="52" y="52" width="100" height="100" rx="8" fill="#2c1a16" stroke="#ee6a4c" stroke-width="2"/>
    <path d="M70 102h64M102 70v64" stroke="#ee6a4c" stroke-width="2" opacity="0.6"/>
    <g stroke="#84807a" stroke-width="2">
      <path d="M52 76H22V30"/>
      <path d="M52 128H30v46"/>
      <path d="M152 76h30V22"/>
      <path d="M152 128h22v54"/>
      <path d="M78 52V24h-26"/>
      <path d="M126 152v28h28"/>
    </g>
    <g fill="#6cc890" stroke="none">
      <circle cx="22" cy="30" r="5"/>
      <circle cx="182" cy="22" r="5"/>
      <circle cx="154" cy="180" r="5"/>
    </g>
    <g fill="#ee6a4c" stroke="none">
      <circle cx="30" cy="174" r="5"/>
      <circle cx="52" cy="24" r="5"/>
      <circle cx="174" cy="182" r="5"/>
    </g>
    <g stroke="#34312e" stroke-width="6">
      <path d="M-14 40h10M-14 70h10M-14 100h10M-14 130h10M-14 160h10"/>
      <path d="M208 40h10M208 70h10M208 100h10M208 130h10M208 160h10"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(72 92)">
    <rect width="64" height="64" rx="16" fill="#ee6a4c"/>
    <text x="32" y="45" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#ffffff">R</text>
    <text x="88" y="48" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#ecebe8" letter-spacing="-1">RocketIDE</text>
  </g>
  <text x="72" y="210" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" fill="#b8b4ae">Design chips with an AI agent beside you.</text>
  <text x="72" y="244" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" fill="#b8b4ae">Every <tspan fill="#6cc890" font-weight="600">PASS</tspan> comes from a real EDA tool.</text>
  <text x="72" y="284" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#84807a">analog · digital · photonic   —   ngspice · Icarus · SAX · Magic · KLayout · LibreLane</text>
</svg>
